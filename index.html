<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Starb3rry</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f6f7f9;
    color: #151515;

    min-height: 100vh;
}


/* =========================
   NAVBAR
========================= */

.navbar {

    position: sticky;
    top: 0;

    z-index: 100;

    height: 72px;

    background: rgba(255,255,255,.9);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid #e7e7e7;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 7%;
}

.logo {

    font-size: 21px;

    font-weight: 800;

    letter-spacing: -.5px;

    cursor: pointer;

    user-select: none;

}

.logo span {
    color: #ff3b6b;
}

.nav {

    display: flex;

    gap: 26px;

}

.nav a {

    text-decoration: none;

    color: #777;

    font-size: 14px;

    transition: .2s;

}

.nav a:hover {
    color: #111;
}


/* =========================
   HERO
========================= */

.hero {

    max-width: 1100px;

    min-height: 650px;

    margin: auto;

    padding: 80px 25px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}

.tag {

    color: #999;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 22px;

}

.hero h1 {

    font-size: clamp(55px, 11vw, 105px);

    line-height: .9;

    letter-spacing: -6px;

    margin-bottom: 28px;

}

.hero h1 span {
    color: #ff3b6b;
}

.hero p {

    max-width: 620px;

    color: #737373;

    font-size: 17px;

    line-height: 1.7;

    margin-bottom: 35px;

}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    justify-content: center;

}

.button {

    text-decoration: none;

    padding: 13px 22px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 650;

    transition: .25s;

}

.button:hover {

    transform: translateY(-3px);

}

.primary {

    background: #151515;

    color: white;

}

.primary:hover {

    box-shadow:
        0 12px 25px rgba(0,0,0,.15);

}

.secondary {

    background: white;

    color: #222;

    border: 1px solid #ddd;

}

.secondary:hover {

    border-color: #aaa;

}


/* =========================
   SECTIONS
========================= */

.section {

    max-width: 1100px;

    margin: auto;

    padding: 90px 25px;

}

.section-label {

    color: #999;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 9px;

}

.section-title {

    font-size: 34px;

    letter-spacing: -1.5px;

    margin-bottom: 35px;

}


/* =========================
   CARDS
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(230px,1fr));

    gap: 17px;

}

.card {

    background: white;

    border: 1px solid #e7e7e7;

    border-radius: 16px;

    padding: 28px;

    transition: .25s;

}

.card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 18px 40px rgba(0,0,0,.06);

}

.icon {

    width: 44px;

    height: 44px;

    border-radius: 12px;

    background: #fff0f4;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 20px;

    font-size: 19px;

}

.card h3 {

    font-size: 17px;

    margin-bottom: 8px;

}

.card p {

    color: #777;

    font-size: 14px;

    line-height: 1.65;

}


/* =========================
   YOUTUBE
========================= */

.youtube {

    background: white;

    border: 1px solid #e7e7e7;

    border-radius: 18px;

    padding: 32px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 25px;

}

.youtube h3 {

    font-size: 22px;

    margin-bottom: 5px;

}

.youtube p {

    color: #777;

    font-size: 14px;

}

.youtube a {

    background: #ff003c;

    color: white;

    text-decoration: none;

    padding: 13px 20px;

    border-radius: 9px;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    transition: .2s;

}

.youtube a:hover {

    transform: translateY(-2px);

    box-shadow:
        0 10px 20px rgba(255,0,60,.18);

}

   MEMBERS
