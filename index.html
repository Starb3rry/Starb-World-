<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starb3rry</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;

    background: #f7f8fa;
    color: #171717;
    line-height: 1.6;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid #e9e9e9;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;

    cursor: pointer;

    transition: 0.25s;
}

.logo:hover {
    transform: scale(1.04);
}

.logo span {
    color: #ff3b70;
}

.navlinks {
    display: flex;
    gap: 28px;
}

.navlinks a {
    text-decoration: none;
    color: #666;

    font-size: 14px;
    font-weight: 500;

    transition: 0.2s;
}

.navlinks a:hover {
    color: #111;
}


/* =========================
   HERO
========================= */

.hero {
    max-width: 1050px;
    margin: auto;

    min-height: 620px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 80px 25px;
}
